<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9ecf6;
    --surface: #ffffff;
    --ink: #151826;
    --muted: #5b6078;
    --line: #cfd4e6;
    --accent: #2f3cff;
    --accent-ink: #ffffff;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12142a; --surface: #1c1f3b; --ink: #eceeff; --muted: #9ba1c7;
      --line: #2e3260; --accent: #7b86ff; --accent-ink: #12142a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12142a; --surface: #1c1f3b; --ink: #eceeff; --muted: #9ba1c7;
    --line: #2e3260; --accent: #7b86ff; --accent-ink: #12142a; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 64px; }

  /* Library header */
  header.top { padding: 56px 0 28px; }
  h1 {
    margin: 0; font-size: clamp(3rem, 11vw, 7.5rem); line-height: .9;
    font-weight: 800; letter-spacing: -0.04em;
  }
  .count { margin: 14px 0 0; color: var(--muted); font-size: 1.05rem; }

  .tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0 28px; }
  .search {
    flex: 1 1 220px; min-width: 0; padding: 12px 16px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line);
    background: transparent; cursor: pointer;
  }
  .tag[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Game tiles */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; padding: 0; margin: 0; list-style: none; }
  .tile {
    all: unset; box-sizing: border-box; display: flex; flex-direction: column; width: 100%; height: 100%;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer;
  }
  .tile:hover .art { filter: saturate(1.25); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .art {
    aspect-ratio: 4 / 3; display: grid; place-items: center; font-size: 4.5rem;
    background: var(--tint); background-size: cover; background-position: center;
    transition: filter .15s;
  }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
  .meta h2 { margin: 0; font-size: 1.35rem; letter-spacing: -0.02em; }
  .meta p { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.4; }
  .meta small { color: var(--muted); }
  .empty { padding: 48px 0; color: var(--muted); }

  /* Player */
  #player { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1.5px solid var(--line); background: var(--surface); }
  .bar h2 { margin: 0 auto 0 4px; font-size: 1.1rem; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #frame { flex: 1; width: 100%; border: 0; background: #000; }

  @media (prefers-reduced-motion: reduce) { .art { transition: none; } }
</style>
</head>
<body>

<div id="library">
  <div class="wrap">
    <header class="top">
      <h1>Game Shelf</h1>
      <p class="count" id="count"></p>
    </header>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games">
      <div class="tags" id="tags" role="group" aria-label="Filter by tag"></div>
    </div>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>No games match. Clear the search or pick another tag.</p>
  </div>
</div>

<div id="player" hidden>
  <div class="bar">
    <button class="btn" id="back">Back to games</button>
    <h2 id="gameTitle"></h2>
    <button class="btn" id="reload">Restart</button>
    <button class="btn primary" id="full">Fullscreen</button>
  </div>
  <iframe id="frame" title="Game" allow="fullscreen; gamepad; autoplay"
          sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms"></iframe>
</div>

<script>
const $ = (id) => document.getElementById(id);
let games = [], activeTag = "All";

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Only allow plain hex colors into inline styles.
const safeColor = (c) => (/^#[0-9a-f]{3,8}$/i.test(c) ? c : "#2f3cff");

async function init() {
  try {
    const res = await fetch("games.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    games = await res.json();
  } catch (e) {
    $("count").textContent = "Couldn’t load games.json. Run “node scripts/build-games.js” and serve this folder over http.";
    return;
  }
  renderTags();
  renderGrid();
  route();
}

function renderTags() {
  const all = ["All", ...new Set(games.flatMap((g) => g.tags))].sort((a, b) => (a === "All" ? -1 : b === "All" ? 1 : a.localeCompare(b)));
  $("tags").innerHTML = all.map((t) => `<button class="tag" aria-pressed="${t === activeTag}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
}

function renderGrid() {
  const q = $("search").value.trim().toLowerCase();
  const shown = games.filter((g) =>
    (activeTag === "All" || g.tags.includes(activeTag)) &&
    (!q || `${g.title} ${g.description} ${g.tags.join(" ")}`.toLowerCase().includes(q)));

  $("count").textContent = `${games.length} game${games.length === 1 ? "" : "s"} on the shelf`;
  $("empty").hidden = shown.length > 0;
  $("grid").innerHTML = shown.map((g) => `
    <li>
      <button class="tile" data-id="${esc(g.id)}">
        <span class="art" style="--tint:${safeColor(g.color)}">${g.thumbnail ? `<img src="${esc(g.thumbnail)}" alt="" loading="lazy">` : esc(g.emoji)}</span>
        <span class="meta">
          <h2>${esc(g.title)}</h2>
          ${g.description ? `<p>${esc(g.description)}</p>` : ""}
          ${g.tags.length ? `<small>${g.tags.map(esc).join(", ")}</small>` : ""}
        </span>
      </button>
    </li>`).join("");
}

function route() {
  const id = location.hash.slice(1);
  const game = games.find((g) => g.id === id);
  $("library").hidden = !!game;
  $("player").hidden = !game;
  if (game) {
    document.title = `${game.title} | Game Shelf`;
    $("gameTitle").textContent = game.title;
    if ($("frame").dataset.id !== game.id) { $("frame").src = game.path; $("frame").dataset.id = game.id; }
  } else {
    document.title = "Game Shelf";
    $("frame").removeAttribute("src"); delete $("frame").dataset.id;
  }
}

$("grid").addEventListener("click", (e) => {
  const tile = e.target.closest(".tile");
  if (tile) location.hash = tile.dataset.id;
});
$("tags").addEventListener("click", (e) => {
  const b = e.target.closest(".tag");
  if (!b) return;
  activeTag = b.dataset.tag; renderTags(); renderGrid();
});
$("search").addEventListener("input", renderGrid);
$("back").addEventListener("click", () => { location.hash = ""; history.replaceState(null, "", location.pathname + location.search); route(); });
$("reload").addEventListener("click", () => { const f = $("frame"); const s = f.src; f.src = "about:blank"; setTimeout(() => (f.src = s), 30); });
$("full").addEventListener("click", () => { const f = $("frame"); (f.requestFullscreen || f.webkitRequestFullscreen).call(f); });
addEventListener("hashchange", route);

init();
</script>
</body>
</html>
